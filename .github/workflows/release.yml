name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --verify-tag --title "Argon ${{ github.ref_name }}" --generate-notes

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: ["create-release"]
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - host: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64

          - host: macos
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

          # aarch64
          - host: linux
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64

          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

          - host: windows
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-features --release --verbose --target ${{ matrix.target }}
        env:
          ARGON_TOKEN: ${{ secrets.ARGON_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Artifact Name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=argon-${{ github.ref_name }}-${{ matrix.label }}.zip" >> "$GITHUB_ENV"

      - name: Archive and Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release

          if [ "${{ matrix.host }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/argon.exe" release/
            cd release
            7z a ../$ARTIFACT_NAME *
          else
            cp "target/${{ matrix.target }}/release/argon" release/
            cd release
            zip ../$ARTIFACT_NAME *
          fi

          cd ..
          gh release upload ${{ github.ref_name }} $ARTIFACT_NAME --clobber

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
